name: Android APK

on:
  workflow_dispatch:
    inputs:
      build-mode:
        description: 'check = validate build only, debug = build debug APK, release = build signed release APK'
        required: true
        type: choice
        default: check
        options:
          - check
          - debug
          - release
      release-version:
        description: 'Version name for release builds, for example 1.2.3. Leave blank to auto-generate.'
        required: false
        default: ''

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Determine version values
        id: version
        shell: bash
        run: |
          set -e

          VERSION_CODE="${{ github.run_number }}"

          case "${{ inputs.build-mode }}" in
            release)
              if [[ -n "${{ inputs.release-version }}" ]]; then
                VERSION_NAME="${{ inputs.release-version }}"
              else
                LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
                if [[ -n "$LATEST_TAG" ]]; then
                  TAG_VALUE="${LATEST_TAG#v}"
                  IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_VALUE"
                  PATCH=${PATCH:-0}
                  VERSION_NAME="${MAJOR:-0}.${MINOR:-0}.$((PATCH + 1))"
                else
                  VERSION_NAME="0.1.0"
                fi
              fi
              ;;
            debug)
              VERSION_NAME="0.0.${VERSION_CODE}-debug"
              ;;
            *)
              VERSION_NAME="0.0.${VERSION_CODE}-check"
              ;;
          esac

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject Android version metadata
        shell: bash
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle

      - name: Build debug APK
        if: ${{ inputs.build-mode == 'debug' }}
        run: cd android && ./gradlew assembleDebug

      - name: Prepare signed release keystore
        if: ${{ inputs.build-mode == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD to repository secrets."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        if: ${{ inputs.build-mode == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are missing. Cannot build signed APK."
            exit 1
          fi

          cd android && ./gradlew assembleRelease

      - name: Upload debug APK artifact
        if: ${{ inputs.build-mode == 'debug' }}
        uses: actions/upload-artifact@v7
        with:
          name: daily-budget-flow-${{ steps.version.outputs.version_name }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK artifact
        if: ${{ inputs.build-mode == 'release' && hashFiles('android/app/build/outputs/apk/release/app-release.apk') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: daily-budget-flow-${{ steps.version.outputs.version_name }}-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Skip artifact upload for check build
        if: ${{ inputs.build-mode == 'check' }}
        run: 'echo "Check build only: no APK artifact uploaded."'